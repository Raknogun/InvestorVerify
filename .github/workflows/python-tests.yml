name: Python validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Check sourced candidate discovery coverage
        run: python -m investorverify.discover --check
      - name: Check CSV schemas and references
        run: python -m investorverify.validate
      - name: Test source integrity and quality calculations
        run: python -m unittest discover -s tests -v
      - name: Print honest quality status
        run: python -m investorverify.quality
